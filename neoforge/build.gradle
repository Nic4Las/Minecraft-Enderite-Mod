plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge {
        platformPackage = "forge"
    }
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    neoForge {
        //convertAccessWideners = true
        //extraAccessWideners.add loom.accessWidenerPath.get().asFile.name
    }

    runs {
        gameTestServer {
            server()
            environment("gametestserver")
            forgeTemplate("gameTestServer")
            property "neoforge.enabledGameTestNamespaces", "enderitemod"
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    implementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    common(project(path: ':common')) { transitive false }
    shadowBundle(project(path: ':common', configuration: 'transformProductionNeoForge'))

    implementation("me.shedaniel.cloth:cloth-config-neoforge:${rootProject.cloth_config_version}")
    implementation("com.misterpemodder:shulkerboxtooltip-neoforge:${rootProject.shulker_box_tooltip_version}") { transitive false }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', rootProject.minecraft_version_min
    inputs.property 'neoforge_version', rootProject.neoforge_version_min
    inputs.property 'architectury_version', rootProject.architectury_api_version_min
    inputs.property 'cloth_config_version', rootProject.cloth_config_version_min
    inputs.property 'shulker_box_tooltip_version', rootProject.shulker_box_tooltip_version_min

    filesMatching('META-INF/neoforge.mods.toml') {
        expand (version: project.version,
                minecraft_version: rootProject.minecraft_version_min,
                neoforge_version: rootProject.neoforge_version_min,
                architectury_version: rootProject.architectury_api_version_min,
                cloth_config_version: rootProject.cloth_config_version_min,
                shulker_box_tooltip_version: rootProject.shulker_box_tooltip_version_min)
    }
}

shadowJar {
    exclude 'fabric.mod.json'
    exclude 'architectury.common.json'

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn shadowJar
    from {
        zipTree(shadowJar.archiveFile.get().asFile)
    }
}
