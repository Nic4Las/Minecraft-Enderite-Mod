architectury {
    common(rootProject.enabled_platforms.split(","))
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    // Remove the next line if you don't want to depend on the API
    implementation "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"

    common(project(path: ":common")) { transitive false }

    // Config dependencies
	implementation("com.terraformersmc:modmenu:${rootProject.mod_menu_version}") { transitive = false }
	implementation("me.shedaniel.cloth:cloth-config:${rootProject.cloth_config_version}")
	implementation("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}") { transitive = false }

    compileOnly "com.misterpemodder:shulkerboxtooltip-fabric:${rootProject.shulker_box_tooltip_version}"
    runtimeOnly "com.misterpemodder:shulkerboxtooltip-fabric:${rootProject.shulker_box_tooltip_version}"

}
