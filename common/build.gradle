plugins {
    id 'java'
}

architectury {
    common(rootProject.enabled_platforms.split(',')) {
        it.platformPackage "neoforge", "forge"
    }
}

loom {
    accessWidenerPath = file("src/main/resources/enderitemod.classtweaker")
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    implementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    implementation("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    compileOnly "com.misterpemodder:shulkerboxtooltip-fabric:${rootProject.shulker_box_tooltip_version}"
}


def gameTestResources = layout.buildDirectory.dir('generated/gametestResources')
tasks.register('convertGameTestStructures', JavaExec) {
    dependsOn tasks.named('compileJava')
    classpath = files(sourceSets.main.output.classesDirs, configurations.runtimeClasspath)
    mainClass = 'net.enderitemc.enderitemod.tests.ConvertNbt'
    def structures = file('src/main/resources/data/enderitemod/gametest/structure')
    inputs.dir structures
    outputs.dir gameTestResources
    args structures.absolutePath, gameTestResources.get().dir('data/enderitemod/structure').asFile.absolutePath
    workingDir layout.buildDirectory.dir('gametest-converter').get().asFile
    doFirst {
        new File(workingDir, 'logs').mkdirs()
    }
}

processResources {
    dependsOn tasks.named('convertGameTestStructures')
    from gameTestResources
}
